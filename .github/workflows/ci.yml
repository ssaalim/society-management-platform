name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type Check (Frontend)
        run: npm run typecheck --workspace=frontend --if-present

      - name: Type Check (Backend)
        run: npm run typecheck --workspace=backend --if-present

      - name: Build Shared Packages
        run: |
          npm run build --workspace=packages/shared --if-present
          npm run build --workspace=packages/ui --if-present
          npm run build --workspace=packages/config --if-present

      - name: Build Frontend
        run: npm run build --workspace=frontend

      - name: Build Backend
        run: npm run build --workspace=backend

      - name: Run Tests
        run: npm run test --if-present
