version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: society_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: society_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - society_network

  redis:
    image: redis:7-alpine
    container_name: society_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - society_network

volumes:
  postgres_data:
  redis_data:

networks:
  society_network:
    driver: bridge
